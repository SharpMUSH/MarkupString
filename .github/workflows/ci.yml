name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      # Folder mode, not solution mode: `dotnet format` cannot load a solution on the .NET 11
      # SDK (the MSBuild build host crashes). Whitespace rules are syntactic, so nothing is lost.
      - name: Verify formatting
        run: |
          for dir in MarkupString MarkupString.Ansi MarkupString.Extensions.DependencyInjection MarkupString.Html MarkupString.Mxp MarkupString.Pueblo MarkupString.Web MarkupString.Tests MarkupString.AotSmoke; do
            dotnet format whitespace --folder "$dir" --exclude "**/bin/**" --exclude "**/obj/**" --verify-no-changes
          done

  build:
    name: Build and test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # The Pack step below validates against the published baseline, which means the version has
      # to be real: MinVer reads it from the tags, and a shallow clone has none, so every package
      # builds as 0.0.0 and validation rejects it as a downgrade from the baseline.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The .NET 11 SDK builds everything; the .NET 10 runtime runs the tests' net10.0 build, which
      # covers the net10.0 build every package still ships.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore
        run: dotnet restore

      # The format job already covers the whole repository, so the per-project build gate is off.
      - name: Build
        run: dotnet build --configuration Release --no-restore -p:SkipFormatVerification=true

      - name: Test on net11.0
        run: dotnet run --project MarkupString.Tests --configuration Release --no-build --framework net11.0

      - name: Test on net10.0
        run: dotnet run --project MarkupString.Tests --configuration Release --no-build --framework net10.0

      - name: Pack
        run: dotnet pack --configuration Release --no-build -p:SkipFormatVerification=true -o packages

      - name: Every package carries net10.0 and net11.0
        if: runner.os == 'Linux'
        run: |
          for pkg in packages/*.nupkg; do
            for tfm in net10.0 net11.0; do
              unzip -l "$pkg" | grep -q "lib/$tfm/" || { echo "::error::$pkg has no lib/$tfm"; exit 1; }
            done
          done

  web:
    name: Web runtime in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: MarkupString.Web/tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # fragments.json is what the HTML writer writes; MarkupWebTests fails when it is out of date.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  aot:
    name: AOT publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      # The packages promise IsAotCompatible. Publishing the smoke app with every package assembly
      # rooted analyses every public entry point, so a trim- or AOT-hostile addition fails here
      # instead of in a consumer's app. Any IL2xxx/IL3xxx warning is an error.
      - name: Publish natively and fail on any trim/AOT warning
        run: |
          set -o pipefail
          sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
          dotnet publish MarkupString.AotSmoke -c Release -r linux-x64 \
            -p:SkipFormatVerification=true 2>&1 | tee aot.log
          if grep -Eq 'IL[0-9]{4}' aot.log; then
            echo "::error::Trim/AOT warnings from the MarkupString packages (see the lines above)"
            exit 1
          fi

      - name: Run the native binary
        run: ./MarkupString.AotSmoke/bin/Release/net11.0/linux-x64/publish/MarkupString.AotSmoke
